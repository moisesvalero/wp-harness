name: WordPress Verification CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-autonomous-verification:
    name: WordPress FSE & WASM Playground Sandbox Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Pre-cache WP Playground CLI
        run: npx -y @wp-playground/cli --version

      - name: Run Autonomous WordPress Verification Pipeline (test:wp)
        run: pnpm test:wp
